name: build and test C/C++ code

on:
  push:
    branches: [main, dev, 2-add-github-action-ci-for-compiling-test]

  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure-arguments: >
              -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_BUILD_TYPE=Release

          - name: Linux Clang
            os: ubuntu-latest
            configure-arguments: >
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_BUILD_TYPE=Release

          - name: Windows MSVC
            os: windows-2026
            configure-arguments: >
              -G "Visual Studio 17 2026"
              -A x64

          - name: Windows ClangCL
            os: windows-2026
            configure-arguments: >
              -G "Visual Studio 17 2026"
              -A x64
              -T ClangCL
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DBUILD_UNIT_TEST=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure